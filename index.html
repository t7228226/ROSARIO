<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TSEC 人力站點</title>
    <meta name="description" content="TSEC 現場人力與站點資格管理系統" />
    <meta name="application-name" content="TSEC 人力站點" />
    <meta name="theme-color" content="#0b3157" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TSEC 人力站點" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/tsec-workforce-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f4f7fb;
        color: #172033;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      #boot-status {
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        line-height: 1.7;
      }
      #boot-status h1,
      #boot-status p {
        margin: 0;
      }
      #boot-status h1 {
        font-size: 24px;
      }
      #boot-status p {
        color: #58677b;
      }
      #boot-status.error {
        background: #fff7f7;
        color: #7f1d1d;
      }
      #boot-status pre {
        white-space: pre-wrap;
        background: #fff;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: 12px;
        overflow: auto;
      }
    </style>
    <script type="module" src="/boot-status.js"></script>
  </head>
  <body>
    <div id="boot-status">
      <h1>TSEC 人力站點</h1>
      <p>系統載入中，請稍候。</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
