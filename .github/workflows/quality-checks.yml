name: Quality checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check contracts
        run: npm run check:contracts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build preview
        run: npm run build:preview
